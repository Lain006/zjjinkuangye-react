name: Verify

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zj_course
          POSTGRES_DB: zj_course
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U zj_course -d zj_course"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zj_course@127.0.0.1:55432/zj_course
      TEST_DATABASE_URL: postgresql://zj_course@127.0.0.1:55432/zj_course
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run migrate && npm run seed && npm run seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build and smoke-test the production container
        run: |
          image="zijin-course:ci"
          docker build --tag "$image" .
          export ADMIN_PASSWORD="$(openssl rand -hex 24)"
          docker run --rm -d --network host --name zijin-course-ci \
            --env DATABASE_URL --env ADMIN_PASSWORD --env PORT=3201 "$image"
          trap 'docker stop zijin-course-ci' EXIT
          curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 3 \
            http://127.0.0.1:3201/api/v1/health
          curl --fail --silent --show-error http://127.0.0.1:3201/api/v1/documents | \
            jq -e '.total >= 8'
          curl --fail --silent --show-error http://127.0.0.1:3201/ | grep -q 'id="root"'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
